# Checks, tests and the multi-architecture image of every pull request and push to main.
# Images: one job per architecture on a native runner, each pushed by digest (push to main only),
# then one manifest list tagged with the commit and "main".
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cluster-api-provider-vcluster
  GOVULNCHECK_VERSION: v1.9.0
  ENVTEST_K8S_VERSION: 1.35.x

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l main.go api controllers pkg test)"
          [[ -z "$out" ]] || { echo "gofmt needed: $out"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: vendor is current
        run: |
          go mod tidy
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor
      - name: generated files are current (deepcopy, CRDs)
        run: |
          make generate manifests
          git diff --exit-code
      - name: kustomize builds
        run: make release
      - name: govulncheck
        run: |
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - name: tests (unit and envtest)
        run: |
          KUBEBUILDER_ASSETS="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23 use "$ENVTEST_K8S_VERSION" -p path)"
          export KUBEBUILDER_ASSETS
          go test -race ./...

  image:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to GHCR
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: build (push by digest on main)
        env:
          ARCH: ${{ matrix.arch }}
          PUSH: ${{ github.event_name == 'push' }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          if [[ "$PUSH" == true ]]; then
            out="type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true"
          else
            out="type=cacheonly"
          fi
          docker buildx build --platform "linux/$ARCH" --output "$out" \
            --metadata-file "$RUNNER_TEMP/meta.json" .
          if [[ "$PUSH" == true ]]; then
            jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json" >"$RUNNER_TEMP/digests/$ARCH"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 1

  manifest:
    if: github.event_name == 'push'
    needs: [checks, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: manifest list (amd64 + arm64)
        run: |
          refs=()
          for arch in amd64 arm64; do
            refs+=("$IMAGE@$(cat "$RUNNER_TEMP/digests/$arch")")
          done
          docker buildx imagetools create -t "$IMAGE:sha-${GITHUB_SHA::12}" -t "$IMAGE:main" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::12}"
