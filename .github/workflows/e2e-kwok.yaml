# The flux installer end to end on a kwok cluster (hack/e2e-kwok.sh, make e2e-kwok): kwokctl's
# binary runtime, Flux's source-controller and helm-controller, the Cluster API manager and the
# provider as local processes. No Docker.
name: e2e-kwok

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-kwok-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flux-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # kwokctl, the controllers built from their tags and kwokctl's Kubernetes binaries,
      # keyed by the pins
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/e2e-kwok/bin
            .cache/e2e-kwok/crds
            .cache/e2e-kwok/src
            .cache/e2e-kwok/work/cache
          key: e2e-kwok-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/e2e-kwok.env') }}
      - name: e2e-kwok
        run: make e2e-kwok
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-kwok-logs
          path: .cache/e2e-kwok/logs
          retention-days: 7
