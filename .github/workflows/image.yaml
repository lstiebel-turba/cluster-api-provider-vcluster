# The provider image, one job per architecture on a native runner, each pushed by digest
# (push: true) as an artifact digest-<arch>. The caller tags the manifest list with
# hack/image-manifest.sh. Called by ci.yaml and release.yaml; the image is
# ghcr.io/<github.repository>, lowercase.
name: image

on:
  workflow_call:
    inputs:
      push:
        description: Push each architecture's image by digest and upload the digests.
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to GHCR
        if: inputs.push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: build (push by digest)
        env:
          ARCH: ${{ matrix.arch }}
          PUSH: ${{ inputs.push }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          mkdir -p "$RUNNER_TEMP/digests"
          if [[ "$PUSH" == true ]]; then
            out="type=image,name=$image,push-by-digest=true,name-canonical=true,push=true"
          else
            out="type=cacheonly"
          fi
          docker buildx build --platform "linux/$ARCH" --output "$out" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/meta.json" .
          if [[ "$PUSH" == true ]]; then
            jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json" >"$RUNNER_TEMP/digests/$ARCH"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.push
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 1
