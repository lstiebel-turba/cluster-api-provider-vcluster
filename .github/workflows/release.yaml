# A release on a tag v<major>.<minor>.<patch>[-turba.<n>] (README.md#releases): the
# multi-architecture image ghcr.io/<github.repository>:<tag>, then the assets clusterctl and the
# Cluster API Operator read (make release, image pinned by digest) on a GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag's scheme and release series, and the assets with the image still unpinned: a bad tag
  # stops before anything is pushed.
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: tag scheme
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-turba\.[0-9]+)?$ ]] || {
            echo "tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-turba.<n>]"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: release assets (make release, test/release)
        run: make release VERSION="$GITHUB_REF_NAME" IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME"

  image:
    needs: [check]
    uses: ./.github/workflows/image.yaml
    with:
      push: true
    permissions:
      contents: read
      packages: write

  manifest:
    needs: [image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: manifest list (amd64 + arm64) tagged with the version
        id: manifest
        run: |
          digest="$(hack/image-manifest.sh "ghcr.io/${GITHUB_REPOSITORY,,}" "$RUNNER_TEMP/digests" "$GITHUB_REF_NAME")"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

  publish:
    needs: [manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: release assets, image pinned by digest
        env:
          DIGEST: ${{ needs.manifest.outputs.digest }}
        run: make release VERSION="$GITHUB_REF_NAME" IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME@$DIGEST"
      - name: GitHub Release (a re-run replaces the assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.manifest.outputs.digest }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes \
              --notes "Image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME@$DIGEST\`"
          fi
